Categories:
  - Money
License: AGPL-3.0-or-later
AuthorName: Ratnesh Maurya
WebSite: https://ratnesh-maurya.github.io/PennyTrace/
SourceCode: https://github.com/ratnesh-maurya/PennyTrace
IssueTracker: https://github.com/ratnesh-maurya/PennyTrace/issues

AutoName: PennyTrace

RepoType: git
Repo: https://github.com/ratnesh-maurya/PennyTrace.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init: cd ../.. && npm ci --ignore-scripts
    gradle:
      - yes
    prebuild:
      # Build with JDK 21 (what the F-Droid buildserver has).
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      # Prebuilt Hermes compiler shipped by react-native (allowed by F-Droid policy).
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
